name    = Locale-Simple
author  = Torsten Raudssus <torsten@raudssus.de>
license = MIT
copyright_holder = Torsten Raudssus
copyright_year = 2026

[@Author::GETTY]
run_before_release = python python/test.py
run_after_release = cd python && sed -i 's/__version__ = .*/__version__ = "%v"/' locale_simple.py && rm -rf dist && python -m build && twine upload dist/*

[Encoding]
encoding = bytes
match = ^t/data/
