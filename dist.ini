name    = Locale-Simple
author  = Torsten Raudssus <torsten@raudssus.de>
license = MIT
copyright_holder = Torsten Raudssus
copyright_year = 2026

[@Author::GETTY]
run_before_release = python python/test.py
run_before_release = sh -c 'cd js && npm install && npm test'
run_after_release = sh -c 'cd python && sed -i "s/__version__ = .*/__version__ = \"%v\"/" locale_simple.py && rm -rf dist && python -m build && twine upload dist/*'
run_after_release = sh -c 'cd js && npm version %v --no-git-tag-version --allow-same-version && npm run build && npm publish'

[Encoding]
encoding = bytes
match = ^t/data/
