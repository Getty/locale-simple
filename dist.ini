name    = Locale-Simple
author  = Torsten Raudssus <torsten@raudssus.de>
license = MIT
copyright_holder = Torsten Raudssus
copyright_year = 2026

[@Author::GETTY]
; Run Python + JS test suites alongside `dzil test`.
run_test = python python/test.py
run_test = sh -c 'cd js && npm install --silent --no-audit --no-fund && npm test'

; Before release: rebuild both packages from scratch to catch broken tarballs
; or bundler problems — the actual publish happens in run_after_release.
run_before_release = python python/test.py
run_before_release = sh -c 'cd js && npm install --silent --no-audit --no-fund && npm test'
run_before_release = sh -c 'cd python && rm -rf dist && python -m build && twine check dist/*'
run_before_release = sh -c 'cd js && npm run build && npm pack --dry-run'

; After release: bump version files, build, and upload Python + JS packages.
; xbin/release.pl splits the Perl version (e.g. 0.100 -> npm 0.1.0) for js.
run_after_release = xbin/release.pl python %v
run_after_release = xbin/release.pl js %v

[Encoding]
encoding = bytes
match = ^t/data/
