[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "locale-simple"
dynamic = ["version"]
description = "Translation system based on gettext, same API in Perl, Python and JavaScript"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Torsten Raudssus", email = "torsten@raudssus.de" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Localization",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/Getty/locale-simple"
Repository = "https://github.com/Getty/locale-simple"
Issues = "https://github.com/Getty/locale-simple/issues"

[tool.setuptools.dynamic]
version = {attr = "locale_simple.__version__"}

[tool.setuptools]
py-modules = ["locale_simple"]
